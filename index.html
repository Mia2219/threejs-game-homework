<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 躲避障碍物游戏</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
    }

    #info {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.7;
        display: none;
        user-select: none;
    }

    #score {
        color: #ffe066;
        font-weight: bold;
    }

    #lives {
        color: #ff6b6b;
        font-weight: bold;
    }

    #startScreen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
    }

    #startScreen h1 {
        font-size: 42px;
        color: #4fc3f7;
    }

    #startScreen p {
        font-size: 18px;
        color: #ddd;
    }

    #startBtn {
        padding: 14px 36px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        background: #4fc3f7;
        color: #000;
        cursor: pointer;
    }

    #startBtn:hover {
        background: #81d4fa;
    }
</style>
</head>
<body>

<div id="startScreen">
    <h1>躲避方块小游戏</h1>
    <p>操作：← → 方向键移动小人</p>
    <p>方块从上方缓慢垂直落下，所有物体在同一平面</p>
    <p>你有 3 次机会，撞到 3 次游戏结束</p>
    <button id="startBtn">点击开始游戏</button>
</div>

<div id="info">
    分数：<span id="score">0</span><br>
    命数：<span id="lives">3</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
    // 场景、相机、渲染器
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070d);

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 光照
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 12, 7);
    scene.add(directionalLight);

    // 网格地面
    const gridSize = 24;
    const gridDivisions = 24;
    const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x1e88ff, 0x103055);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    const groundGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
    const groundMaterial = new THREE.MeshStandardMaterial({
        color:0x0a1220
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    // 创建 3D 小人
    function createPlayer() {
        const player = new THREE.Group();

        const bodyGeometry = new THREE.CapsuleGeometry(0.35, 0.9, 6, 12);
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x4fc3f7 });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 0.75;
        body.castShadow = true;
        player.add(body);

        const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc80 });
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.y = 1.55;
        head.castShadow = true;
        player.add(head);

        const legGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 10);
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x263238 });
        const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
        leftLeg.position.set(-0.18, 0.25, 0);
        leftLeg.castShadow = true;
        player.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
        rightLeg.position.set(0.18, 0.25, 0);
        rightLeg.castShadow = true;
        player.add(rightLeg);

        const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 10);
        const armMaterial = new THREE.MeshStandardMaterial({ color: 0x4fc3f7 });
        const leftArm = new THREE.Mesh(armGeometry, armMaterial);
        leftArm.position.set(-0.55, 0.85, 0);
        leftArm.rotation.z = 0.3;
        leftArm.castShadow = true;
        player.add(leftArm);

        const rightArm = new THREE.Mesh(armGeometry, armMaterial);
        rightArm.position.set(0.55, 0.85, 0);
        rightArm.rotation.z = -0.3;
        rightArm.castShadow = true;
        player.add(rightArm);

        // ✅ 锁定Z=0，和方块同一平面
        player.position.y = 0;
        player.position.x = 0;
        player.position.z = 0;
        return player;
    }

    const player = createPlayer();
    scene.add(player);

    // 平视相机
    camera.position.set(0, 6, 14);
    camera.lookAt(0, 1, 0);

    // 按键状态标记，解决长按卡顿
    const keys = {
        left: false,
        right: false
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === "ArrowLeft") keys.left = true;
        if (e.key === "ArrowRight") keys.right = true;
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === "ArrowLeft") keys.left = false;
        if (e.key === "ArrowRight") keys.right = false;
    });

    // 游戏变量
    const obstacles = [];
    let score = 0;
    let lives = 3;
    let gameTime = 0;
    let spawnTimer = 0;
    // 生成间隔调大，缓慢一个一个出现
    const spawnInterval = 220;
    // 下落速度变慢
    const baseFallSpeed = 0.018;
    let gameStarted = false;
    let invincible = false;
    let invincibleTimer = 0;

    const scoreDom = document.getElementById('score');
    const livesDom = document.getElementById('lives');
    const infoPanel = document.getElementById('info');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    const playerRadius = 0.65;

    // 开始游戏
    startBtn.onclick = function () {
        gameStarted = true;
        startScreen.style.display = "none";
        infoPanel.style.display = "block";
    };

    // 生成障碍物 ✅ Z固定=0，不旋转，垂直下落
    function createObstacle() {
        const size = Math.random() * 0.7 + 0.4;
        const geometry = new THREE.BoxGeometry(size, size, size);
        const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(
                Math.random() * 0.5 + 0.5,
                Math.random() * 0.25 + 0.1,
                Math.random() * 0.25 + 0.1
            )
        });

        const obstacle = new THREE.Mesh(geometry, material);
        obstacle.position.x = (Math.random() - 0.5) * 14;
        obstacle.position.y = 10;
        // 🔴关键：障碍物Z强制等于0，和小人完全同一个平面，不会前后错开！
        obstacle.position.z = 0;
        obstacle.speed = baseFallSpeed;
        obstacle.radius = size * 0.55;
        obstacle.castShadow = true;
        scene.add(obstacle);
        obstacles.push(obstacle);
    }

    // 碰撞检测
    function checkCollision(player, obstacle) {
        const dx = player.position.x - obstacle.position.x;
        const dy = player.position.y - obstacle.position.y;
        const dz = player.position.z - obstacle.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        return dist < playerRadius + obstacle.radius;
    }

    // 受伤后短暂无敌，避免一次碰撞多次扣命
    function setInvincible() {
        invincible = true;
        invincibleTimer = 90;
        player.visible = false;
    }

    function resetGame() {
        alert(`游戏结束！最终得分：${score}`);

        score = 0;
        lives = 3;
        gameTime = 0;
        spawnTimer = 0;
        invincible = false;
        invincibleTimer = 0;

        scoreDom.innerText = score;
        livesDom.innerText = lives;
        player.position.x = 0;
        player.visible = true;

        obstacles.forEach(obstacle => scene.remove(obstacle));
        obstacles.length = 0;
    }

    // 游戏主循环
    function animate() {
        requestAnimationFrame(animate);

        if (!gameStarted) {
            renderer.render(scene, camera);
            return;
        }

        gameTime++;

        // 左右持续顺滑移动
        const moveSpeed = 0.14;
        if (keys.left && player.position.x > -8) {
            player.position.x -= moveSpeed;
        }
        if (keys.right && player.position.x < 8) {
            player.position.x += moveSpeed;
        }

        // 无敌闪烁计时
        if (invincible) {
            invincibleTimer--;
            if (invincibleTimer % 10 < 5) {
                player.visible = false;
            } else {
                player.visible = true;
            }

            if (invincibleTimer <= 0) {
                invincible = false;
                player.visible = true;
            }
        }

        // 按固定间隔生成，一个一个出现
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            createObstacle();
            spawnTimer = 0;
        }

        // 更新障碍物
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obstacle = obstacles[i];

            // 只向下移动，**没有旋转**
            obstacle.position.y -= obstacle.speed;

            // 碰撞扣命
            if (!invincible && checkCollision(player, obstacle)) {
                lives--;
                livesDom.innerText = lives;
                scene.remove(obstacle);
                obstacles.splice(i, 1);

                if (lives <= 0) {
                    resetGame();
                    break;
                } else {
                    setInvincible();
                }
                continue;
            }

            // 方块落地消失并加分
            if (obstacle.position.y < -1) {
                scene.remove(obstacle);
                obstacles.splice(i, 1);
                score += 10;
                scoreDom.innerText = score;
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    // 窗口自适应
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
